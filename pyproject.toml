[project]
name = "spacetrash"
version = "0.1.0"
description = "spacetrash CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13",
]

[project.scripts]
stcli = "stcli.main:app"
st = "stcli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stcli"]
